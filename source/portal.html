ve:true});window.addEventListener('touchmove',e=>{if(current==='mars'&&!busy){const y=e.touches[0].clientY;parent.postMessage({type:'aethra-scroll',delta:touchY-y},'*');touchY=y}},{passive:true});window.addEventListener('keydown',e=>{if(current==='mars'&&!busy&&['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();parent.postMessage({type:'aethra-explore'},'*')}});$('#scroll-cue').onclick=()=>parent.postMessage({type:'aethra-explore'},'*');parent.postMessage({type:'aethra-loaded'},'*');window.addEventListener('resize',resize);resize();render();retrigger('content-revealing');requestAnimationFrame(draw);reveal();
})();</script></body></html>
