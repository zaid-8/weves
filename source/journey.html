<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03050d"><title>AETHRA — Explore Mars</title>
<style>__JOURNEY_CSS__</style>
</head>
<body>
<main class="app" id="app" aria-label="AETHRA Mars exploration chapters">
 <div class="backdrop" aria-hidden="true"></div>
 <svg class="orbits" viewBox="0 0 1200 1000" aria-hidden="true"><g transform="translate(600 500) rotate(-20)"><ellipse rx="590" ry="440" class="warm"/><ellipse rx="515" ry="385"/><ellipse rx="450" ry="330" class="dashed"/><ellipse rx="390" ry="285"/><ellipse rx="310" ry="225"/><circle cx="480" cy="-256" r="5" class="point warm"/><circle cx="-436" cy="-296" r="5" class="point warm"/><circle cx="-322" cy="-160" r="5" class="point"/><circle cx="145" cy="418" r="5" class="point warm"/><circle cx="-30" cy="-284" r="4" class="point"/></g></svg>
 <header><a class="logo" href="#" aria-label="AETHRA home"><img src="__LOGO__" alt=""><span>AETHRA</span></a><nav aria-label="Main navigation"><button data-panel="mission">MARSWALK</button><button data-panel="radar">MISSION STEPS</button><button data-panel="maps">CHAPTERS</button><button data-panel="tools">TOOLS</button></nav><button class="audio" aria-label="Enable ambient sound" aria-pressed="false" title="Ambient sound"><i></i><i></i><i></i><i></i></button><button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">☰</button></header>
 <section class="scene" aria-label="Destination carousel" aria-roledescription="carousel"><div class="parallax" id="cards"></div></section>
 <section class="copy" aria-live="polite" aria-atomic="true"><div class="copy-inner"><div class="eyebrow"><span class="status-dot"></span><span class="status" id="status">01</span><span class="tag" id="tag">EXPLORE YOUR DESTINATION</span></div><div class="title-wrap"><h1 class="title" id="title">MARS TERRAIN</h1></div><p class="description" id="description">Explore the terrain. Prepare your next step.</p></div><button class="ascend" id="ascend"><span>EXPLORE THE GLOBE</span></button><button id="topic-details" class="topic-details">WHY THIS STEP MATTERS ↗</button></section>
 <div class="arrows"><button class="round" id="next" aria-label="Next destination"><svg viewBox="0 0 20 20"><path d="M6 3 17 10 6 17Z"/></svg></button><button class="round" id="previous" aria-label="Previous destination"><svg viewBox="0 0 20 20"><path d="M14 3 3 10 14 17Z"/></svg></button></div>
 <div class="map-switch"><button class="all-maps" data-panel="maps">ALL CHAPTERS ▸</button><div class="thumbs" aria-label="Choose destination"></div></div>
 <div class="counter"><b id="count">01</b> / 05</div><div class="hint" id="journey-hint">SCROLL TO CHANGE CHAPTER · CONTINUE BELOW TO EXPLORE</div><a class="artwork-note" id="artwork-note" href="https://science.nasa.gov/mars/" target="_blank" rel="noopener">NASA Mars imagery · archived observations</a><button class="continue" id="continue">Continue to Mars tools ↓</button><div class="loading-line"></div>
 <div class="flight" aria-hidden="true" role="dialog" aria-modal="true" aria-label="NASA Mars image viewer"><img alt=""><div class="flight-ui"><div class="flight-top"><span><i></i> NASA MARS IMAGE</span><button class="secondary" id="leave-flight">← RETURN TO ORBIT</button></div><div class="flight-bottom"><p id="flight-sector"></p><h2 id="flight-title"></h2><p>ARCHIVED NASA IMAGERY · NOT A LIVE VIEW</p></div></div></div><div class="toast" role="status"></div>
</main>
<dialog id="panel"><div class="dialog-top"><span id="panel-label">AETHRA / MARS</span><button class="close" aria-label="Close panel">×</button></div><div class="dialog-body" id="panel-content"></div></dialog>
<script>__JOURNEY_JS__</script>
</body></html>
