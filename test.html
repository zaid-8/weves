async function travel(){if(busy)return;busy=true;tx=ty=0;const next=states[current].next;try{tv.src=states[current].portal;tv.load();app.classList.add('is-loading');const ok=await ready(tv);app.classList.remove('is-loading','content-revealing','mask-revealing');app.classList.add('is-transitioning');transitionActive=true;let ending=null;if(ok){tv.currentTime=0;tv.playbackRate=1.3;ending=endWait(tv);try{await tv.play()}catch{ending.cancel()}}await animate(v=>expansion=v,1100);if(ending)await ending.promise;const d=Math.min(devicePixelRatio||1,2);scene.width=innerWidth*d;scene.height=innerHeight*d;sc.setTransform(d,0,0,d,0,0);fallback(sc,next);if(ok)cover(sc,tv);frozen=true;current=next;render();transitionActive=false;expansion=0;maskScale=0;app.classList.remove('is-transitioning');await ready(pv,900);retrigger('content-revealing');await reveal()}finally{tv.pause();tv.removeAttribute('src');tv.load();transitionActive=false;expansion=0;maskScale=1;app.classList.remove('is-loading','is-transitioning');busy=false}}
